{% extends 'base.html' %}
{% block title %}Eliminar Empleado{% endblock %}
{% block content %}
<h1>Eliminar Empleado</h1>

    <p>¿Estás seguro de que deseas eliminar al siguiente empleado?</p>
    <p><strong>{{ empleado.nombres }} {{ empleado.apellidos }}</strong></p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <hr>
    <a href="{% url 'personal:empleado_lista' %}">Cancelar</a>
{% endblock %}

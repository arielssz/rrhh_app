{% extends 'base.html' %}
{% block title %}Eliminar Capacitación{% endblock %}
{% block content %}
<h1>Eliminar Capacitación</h1>

    <p>¿Estás seguro de que deseas eliminar esta capacitación?</p>

    <p><strong>{{ capacitacion.nombre }}</strong></p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <hr>

    <a href="{% url 'personal:capacitacion_lista' %}">Cancelar</a>
{% endblock %}
